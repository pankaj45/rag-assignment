spring.application.name=secfix

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:secfixdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAI
openai.api-key=${OPENAI_API_KEY}
openai.base-url=https://api.openai.com/v1
openai.embedding.model=text-embedding-3-small
openai.completion.model=gpt-4o-mini
openai.completion.temperature=0.0
openai.completion.max-tokens=1024
openai.completion.schema-max-tokens=2048

# RAG - Chunking
rag.chunker.chunk-size-tokens=500
rag.chunker.overlap-tokens=50

# RAG - Retrieval
rag.retrieval.top-k=5
rag.retrieval.min-score=0.75

# Questionnaire - rows per sheet sent to LLM for schema inference
rag.questionnaire.snapshot-rows=20

# Multipart upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.example.secfix=INFO
